<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page with cross-origin iframes (fixture)</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<nav><a href="/">fixtures</a></nav>
<h1>Parent page <code id="me"></code></h1>
<form id="f">
  <label for="main-email">Email (field of the main page, outside the iframe)</label>
  <input id="main-email" name="email" type="email">
</form>
<p class="hint">Below: the same form served from two other origins (different host name = different origin).
Per-site permission for the parent does NOT cover them (S2).</p>
<h2>iframe 1 — <code id="o1"></code></h2>
<iframe id="fr1" title="iframe one" style="width:100%;height:42rem;border:1px solid #8886"></iframe>
<h2>iframe 2 — <code id="o2"></code></h2>
<iframe id="fr2" title="iframe two" style="width:100%;height:42rem;border:1px solid #8886"></iframe>
<script>
  var port = location.port ? ":" + location.port : "";
  function other(host) { return location.protocol + "//" + host + port + "/form-basic.html"; }
  // Pick two hosts different from the current one.
  var pool = ["a.localhost", "b.localhost", "c.localhost", "localhost", "127.0.0.1"].filter(function (h) { return h !== location.hostname; });
  var u1 = other(pool[0]), u2 = other(pool[1]);
  document.getElementById("me").textContent = location.origin;
  document.getElementById("o1").textContent = new URL(u1).origin;
  document.getElementById("o2").textContent = new URL(u2).origin;
  document.getElementById("fr1").src = u1;
  document.getElementById("fr2").src = u2;
</script>
<script src="/assets/common.js"></script>
</body>
</html>
